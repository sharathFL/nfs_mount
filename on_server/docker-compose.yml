version: '3'

services:
  nfs:
    image: itsthenetwork/nfs-server-alpine:latest
    privileged: true
    volumes:
      - ./mcm_shared_volume/:/shared
    environment:
      - SHARED_DIRECTORY=/shared
      # Uncomment or add these as needed:
      # - PERMITTED=192.168.68.0/24  # Allow your subnet
      # - READ_ONLY=true           # Uncomment if read-only is desired
      # - SYNC=true                # Uncomment if sync is desired
    ports:
      - "2049:2049"  # NFS
    #   # - "111:111"    # RPCBind
    # network_mode: host
    command: ["showmount", "-e"]

